syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";

import "helloworld/service/v1/greeter.proto";

// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (helloworld.service.v1.HelloRequest) returns (helloworld.service.v1.HelloReply) {
    option (google.api.http) = {
      get: "/helloworld/{name}"
    };
  }
}
